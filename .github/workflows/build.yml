name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Publishes to ghcr.io/electrickc/dungeonclaw-pitbot — the repo-derived
          # GHCR package that the default GITHUB_TOKEN can write to. The legacy
          # janus-starter-bot package was created manually and would need
          # GHCR_PUSH_TOKEN to push to it (not currently configured). Swap the
          # tag back to janus-starter-bot once that PAT is added to repo secrets.
          tags: |
            ghcr.io/electrickc/dungeonclaw-pitbot:latest
            ghcr.io/electrickc/dungeonclaw-pitbot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
