name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Pre-existing janus-starter-bot package was created manually and
          # isn't auto-writable by the default GITHUB_TOKEN. PAT has packages:write.
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Hardcoded image name — the repo is still 'dungeonclaw-pitbot' for
          # historical reasons but the product is JanusDLMM, so the published
          # image lives under the brand name. Repo URL stays untouched.
          tags: |
            ghcr.io/electrickc/janus-starter-bot:latest
            ghcr.io/electrickc/janus-starter-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
