services:
  pitbot:
    build: .
    restart: unless-stopped
    environment:
      BOT_PRIVATE_KEY:
      DRPC_BASE_KEY:
      ADMIN_WEBHOOK_HMAC:
      VERCEL_BYPASS_SECRET:

      ADMIN_WEBHOOK_URL: https://admin.dungeonclaw.com/api/pitbot/event

      POOL_ADDRESS: "0xa801f4addaa97ed96f0c38430cdf937b9c84487b"
      DCLAW_ADDRESS: "0xb7965A38552E0f7D5B728BAd1Ef2817ca7AE0B68"
      WETH_ADDRESS: "0x4200000000000000000000000000000000000006"
      BIN_STEP: "240"

      TOTAL_WETH_BUDGET: "0.1"
      WALL_BIN_COUNT: "7"
      BIN_OFFSET_FROM_ACTIVE: "3"
      SKEW: "exponential"
      REBALANCE_BINS_THRESHOLD: "2"
      REBALANCE_COOLDOWN_SECONDS: "60"
      POLL_INTERVAL_SECONDS: "15"

      DRY_RUN: "1"
      KILL: "0"
      MAX_GAS_GWEI: "2"

      LOG_LEVEL: info
