services:
  bot:
    build: .
    environment:
      POOL_ID: pool-dev
      CONTROL_PLANE_URL: http://host.docker.internal:8080
      CONTROL_PLANE_TOKEN: dev-token
      RPC_URL: https://mainnet.base.org
      STATE_PATH: /data/state.json
    volumes:
      - bot-state:/data
    restart: unless-stopped

volumes:
  bot-state:
