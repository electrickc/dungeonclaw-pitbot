# SecretVM-pinned compose for the Janus STARTER bot.
# All sensitive env values come from `secretvm-cli vm create -e KEY=VALUE` flags
# at provision time. Sealed by KMS, never decrypted outside the enclave.
services:
  bot:
    image: ghcr.io/electrickc/janus-starter-bot@sha256:5decf7a043748b6529df945558fcd0b1f0209f03307c9d42e742f386427f477c
    environment:
      POOL_ID: ${POOL_ID}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL}
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN}
      RPC_URL: ${RPC_URL}
      STATE_PATH: /data/state.json
    volumes:
      - bot-state:/data
    restart: unless-stopped

volumes:
  bot-state:
